# Configuración de herramientas (el paquete no se distribuye: no hay [project]).
# Instalar en local: `pip install -r requirements-dev.txt` (pinea ruff y mypy a lo que corre CI).

[tool.pytest.ini_options]
testpaths = ["tests"]
# Los tests importan `app` y `tests.conftest` desde la raíz del repo (no hay paquete instalado).
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, B = bugbear, UP = pyupgrade, SIM = simplify.
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["app"]
# torch/sentence-transformers/llama_cpp/sentry_sdk no traen stubs (ni están en el venv de tests).
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
