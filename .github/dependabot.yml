# Dependabot: PRs semanales (lunes) para las actions (fijadas por SHA), las dependencias Python
# y las imágenes base de los dos Dockerfiles (fijadas por digest).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Los rangos de requirements.txt solo se tocan si la versión nueva queda fuera de ellos (no
    # una PR por cada release que sube el mínimo); las imágenes fijan lo que instalan.
    versioning-strategy: increase-if-necessary
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Cambian los embeddings / el LLM: se actualizan a mano y se re-evalúa (evaluation/ del search-service).
      - dependency-name: torch
      - dependency-name: sentence-transformers
      - dependency-name: llama-cpp-python
      # numpy va ligado a la versión de torch.
      - dependency-name: numpy

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Python 3.11 -> 3.12+ (para Dependabot, salto "menor") y CUDA 12.x -> 13 obligan a cambiar
      # las ruedas de torch y llama-cpp-python: a mano, reconstruyendo y probando un training real.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: nvidia/cuda
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
