name: Release para RunPod

# RunPod (integración GitHub) NO reconstruye con cada push: solo cuando se publica una
# Release. Este workflow crea una release automática en cada push a master, de modo que
# "push a master" == "nueva versión desplegada en el endpoint". Antes: gitleaks y escaneo de
# dependencias (Trivy): una vulnerabilidad CRÍTICA con arreglo disponible no llega a RunPod.
#
# Actions fijadas por SHA de commit (el tag es un comentario); Dependabot las actualiza.
on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # Ningún secreto llega al historial: gitleaks sobre todo el repo (binario oficial vía docker;
  # la action de gitleaks exige licencia en organizaciones, el binario no).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact -v --exit-code 1

  # La imagen la construye RunPod (no pasa por GHCR), así que aquí se escanean las dependencias
  # declaradas (requirements*.txt) en vez de la imagen. El informe completo va a Code scanning.
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Trivy (informe SARIF)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy.sarif
      - name: Trivy (bloqueo por CRITICAL con arreglo)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

  release:
    needs: [secrets, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ github.run_number }}
          name: v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: "Release automática para RunPod (commit ${{ github.sha }})"
