name: Release para RunPod

# RunPod (integración GitHub) NO reconstruye con cada push: solo cuando se publica una Release.
# Publicar una versión = `bash release.sh X.Y.Z` (deja el tag vX.Y.Z apuntando a la sección
# `## [X.Y.Z]` de CHANGELOG.md) + push del tag. Este workflow pasa los checks (gitleaks, ruff +
# mypy, pytest, Trivy) y crea la Release con las notas de esa versión, que es lo que dispara la
# reconstrucción del endpoint. Un push a master ya no crea releases: solo pasa por ci.yml.
#
# Actions fijadas por SHA de commit (el tag es un comentario); Dependabot las actualiza.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
      security-events: write

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Validar el tag (semver vX.Y.Z)
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag no semver: $GITHUB_REF_NAME"; exit 1; }
      # Notas = la sección `## [X.Y.Z]` de CHANGELOG.md (hasta el siguiente `## [`); sin ella, no hay release.
      - name: Notas de la versión (CHANGELOG.md)
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/{p = index($0, "[" v "]") > 0} p' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || { echo "::error::CHANGELOG.md no tiene la sección ## [${GITHUB_REF_NAME#v}]"; exit 1; }
          cat notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: notes.md
